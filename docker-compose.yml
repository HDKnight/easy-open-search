# easy-open-search 本地 OpenSearch 依赖（开发用）
services:
  opensearch:
    # OpenSearch 官方镜像
    image: opensearchproject/opensearch:3.8.0
    container_name: opensearch
    restart: unless-stopped
    environment:
      # 集群名称
      - cluster.name=docker-cluster
      # 节点名称
      - node.name=opensearch-node
      # 单节点发现（本地开发）
      - discovery.type=single-node
      # 锁定内存，避免 swap
      - bootstrap.memory_lock=true
      # JVM 堆大小
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # 初始管理员密码（通过环境变量注入）
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      # 数据 / 配置 / 日志挂载到当前目录
      - ./data:/usr/share/opensearch/data
      - ./config:/usr/share/opensearch/config
      - ./logs:/usr/share/opensearch/logs
    ports:
      # 宿主机 9206 -> 容器 9200（避免与本机 ES 9200 冲突）
      - "9206:9200"
      # 性能监控端口映射
      - "9606:9600"
    networks:
      - opensearch-net

networks:
  opensearch-net:
    driver: bridge
